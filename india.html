<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Would You Survive Ancient India?</title><style>
:root{font-family:Georgia,serif;color:#2d2631;background:#171d2d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#4b3459,#171d2d 80%);min-height:100vh;padding:20px}main{max-width:820px;margin:0 auto}.top{color:#fff;text-align:center;padding:10px 0 16px}.top h1{font-family:system-ui,sans-serif;letter-spacing:.04em;font-size:clamp(23px,5vw,40px);margin:8px 0}.top p{margin:0;color:#f7dfb1}.panel{background:#fff4dc;border:5px solid #d8a752;border-radius:20px;box-shadow:0 16px 50px #08081299;overflow:hidden}.scene{padding:clamp(20px,5vw,42px)}.eyebrow{font:700 12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.15em;color:#875329}.scene h2{font-size:clamp(25px,4vw,35px);line-height:1.2;margin:10px 0 16px}.story{font-size:19px;line-height:1.63;white-space:pre-line}.choices{display:grid;gap:12px;margin-top:26px}.choice{appearance:none;background:#fffdf6;color:#2d2631;text-align:left;border:2px solid #d4b67d;border-radius:12px;padding:16px 18px;font:600 17px/1.35 system-ui,sans-serif;cursor:pointer;transition:.15s}.choice:hover,.choice:focus-visible{background:#fff0c4;border-color:#88502c;transform:translateY(-1px)}.choice:focus-visible{outline:3px solid #375b7a;outline-offset:2px}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:25px;border-top:1px solid #c7b58d;padding-top:15px;font:13px system-ui,sans-serif;color:#6d5d4b}.restart{border:0;background:#513452;color:white;padding:10px 15px;border-radius:8px;cursor:pointer;font:600 13px system-ui,sans-serif}.tag{background:#e6d3a9;border-radius:20px;padding:5px 10px}.end{border-left:5px solid #a56532;padding-left:15px;font-weight:700}.note{font:14px/1.5 system-ui,sans-serif;color:#655846;margin-top:18px;border-top:1px dashed #baa47e;padding-top:12px}.hide{display:none}@media(max-width:550px){body{padding:9px}.scene{padding:19px}.story{font-size:17px}.choice{font-size:16px}.footer{flex-wrap:wrap}}
</style></head><body><main><header class="top"><div>🐘 ✦ 🪷 ✦ 🐘</div><h1>WOULD YOU SURVIVE ANCIENT INDIA?</h1><p>The Missing Grain</p></header><section class="panel"><div class="scene"><div class="eyebrow" id="eyebrow">Mauryan Empire · c. 250 BCE</div><h2 id="title"></h2><div class="story" id="story" aria-live="polite"></div><div class="choices" id="choices"></div><div class="note hide" id="note"></div><div class="footer"><span class="tag" id="chapter">Your story begins</span><button class="restart" id="restart" type="button">↻ Start over</button></div></div></section></main><script>
'use strict';
// All characters and incidents are fictional; historical context is inspired by the Mauryan period.
const $=id=>document.getElementById(id);
const initial=()=>({food:3,trust:0,proof:0,injury:0,coins:2,elephant:false,friend:false,route:'',promise:false,chapter:0,seen:[],flags:{}});
let s=initial();
const N={
start:{title:'The Grain That Never Came',chapter:'Your village',text:`Mauryan Empire, about 250 BCE. Your village lies near a busy river route. After a poor harvest, families are waiting for grain promised by district officials. Your mother has stretched the last lentils into a soup so thin that your cousin Mira calls it “warm water with ambitions.”\n\nThis morning a guard arrives with terrible news. Government records say the grain was delivered—and your older brother Arun, who helped count supplies at the riverside depot, has been accused of stealing it. He has been taken to the district town for questioning.\n\nYou know Arun would never take food from hungry neighbors. But the records say otherwise. Your mother grips your arm. “Bring him home if you can. And please, don't get yourself arrested too.”\n\nYou have enough food for a short journey. What matters most to you?`,choices:[['Go to the district office and demand to see Arun.','office',{trust:1}],['Look for the missing grain before the village runs out of food.','village',{food:-1}],['Ask the traders at the river what they saw.','market',{proof:1}]]},

village:{title:'Empty Bowls',chapter:'Your village',text:`At the village well, hungry families argue about the missing delivery. Elder Sona shows you a clay tally mark used when grain is received. No one in the village made such a mark for this shipment.\n\nA farmer offers you a little millet for the road, but his children are hungry too. Mira whispers, “We could find grain without finding whoever lied. Maybe that is enough.”`,choices:[['Take Sona’s account to the district office to help Arun.','office',{proof:1,trust:1}],['Follow the river path toward the government storehouse.','depot',{proof:1}],['Organize food sharing while others search for the shipment.','sharing',{trust:2,food:-1}]]},
sharing:{title:'A Village Holds Together',chapter:'Your village',text:`You persuade families to share what they can. It buys everyone a few days, but it does not explain why Arun is accused or where the grain went.\n\nA traveler says a merchant named Jaya saw government grain barges near a landing downstream. Mira raises an eyebrow. “Actual information! How unusual.”`,choices:[['Find Jaya at the riverside market.','market',{trust:1}],['Carry the villagers’ statements to the district office.','office',{proof:1}],['Stay and organize another food collection.','villageEnd',{trust:1}]]},
market:{title:'Jaya and the Hungry Elephant',chapter:'The river market',text:`At the riverside market, you meet Jaya, a trader who knows every bend in the river. She remembers Arun counting sacks at the government depot two days ago. “He complained that the numbers did not match,” she says. “Then a barge carrying grain left at dusk for a private landing instead of your village.”\n\nBeside her stands Chutki, a young elephant who is eating a basket handle. “She helps haul goods,” Jaya explains, “when she feels inspired.”\n\nNow you know which boats people are talking about—and why they matter.`,choices:[['Ask Jaya to testify about the barge at the district office.','office',{proof:2,friend:true}],['Go to the private landing and look for the grain.','landing',{proof:1}],['Help Jaya haul goods in exchange for supplies and information.','merchant',{food:1,trust:1}]]},
merchant:{title:'The Price of a Witness',chapter:'The river market',text:`You spend hours moving baskets while Chutki moves exactly one basket and eats its contents. Jaya feeds you and shows you the mark used on grain sacks bound for your village. She saw that mark on the barge heading downstream.\n\n“I'll tell an investigator what I saw,” she says. “But if you go chasing armed guards, do not expect Chutki to rescue you. She barely rescues my vegetables.”`,choices:[['Bring Jaya and her description of the sacks to the district office.','office',{proof:2,friend:true}],['Follow the barge route by boat in daylight.','boat',{proof:1}],['Borrow Chutki to help move supplies home.','elephant',{food:1,elephant:true}]]},
elephant:{title:'Chutki Has Other Plans',chapter:'The road home',text:`Jaya lends you Chutki to carry supplies. Halfway home, a narrow wooden bridge crosses a fast-moving stream. Chutki stops, trumpets, and refuses to move.\n\nMira studies the bridge. “For once, the elephant might be the sensible one.”`,choices:[['Take the long, shallow ford and deliver the food safely.','foodEnd',{trust:1,food:1}],['Try to lead Chutki across the weak bridge anyway.','bridge',{injury:1}],['Return the elephant and head to the district office.','office',{proof:1}]]},
bridge:{title:'The Bridge Groans',chapter:'Danger',text:`The planks bend under Chutki's weight. She backs away just as the middle of the bridge collapses. You slip toward the rushing water while Mira grabs a hanging rope.`,choices:[['Grab Mira’s rope and scramble back.','market',{injury:1}],['Jump toward the far bank.','bridgeEnd',{injury:2}],['Stay still and let Chutki pull the rope toward you.','foodEnd',{trust:1}]]},
boat:{title:'A River Full of Secrets',chapter:'The river route',text:`Jaya finds a boatman willing to take you downstream. You know from her account that a grain barge diverted toward a private landing. As you round a bend, you spot sacks being unloaded beside a guarded shed. The boatman warns that the current grows dangerous near the reeds.`,choices:[['Land upstream and approach on foot.','landing',{trust:1}],['Hide among the reeds until nightfall.','night',{proof:1}],['Turn around and tell the district investigator what you saw.','office',{proof:1}]]},
night:{title:'The Dark Channel',chapter:'Danger on the river',text:`After sunset you steer closer to the guarded landing. A watchman calls out. The boatman jerks the oar, and the hull strikes a submerged branch. Water begins pouring in.\n\nMira shouts, “I preferred the part of the plan where we were not sinking!”`,choices:[['Help the boatman secure the boat and reach shore.','landing',{injury:1,trust:1}],['Jump into the fast current with the evidence.','riverEnd',{injury:2}],['Abandon the approach and paddle back toward town.','office',{food:-1}]]},
landing:{title:'The Sacks with Your Village’s Mark',chapter:'The hidden landing',text:`At the private landing, you find sacks stamped with the same mark Jaya described: grain intended for your village. A frightened porter says an official ordered the shipment diverted to this shed. He will speak only if you promise not to expose him to the guards.\n\nYou now have a lead that might clear Arun—and food that could save your neighbors.`,choices:[['Ask the porter to come with you to the district investigator.','porter',{proof:2,trust:1}],['Take a marked sack as evidence and leave quietly.','escape',{proof:2}],['Try to move grain back to the village tonight.','grainrun',{food:2,trust:1}]]},
porter:{title:'A Witness with a Family',chapter:'The hidden landing',text:`The porter, Ravi, says he was ordered to change the delivery tallies. He fears the official who gave the order: Vira, the red-sashed supervisor of grain shipments.\n\n“If I speak, I could lose my work,” Ravi says. “My children need food too.”`,choices:[['Promise to ask the investigator to protect Ravi.','office',{proof:2,trust:2,friend:true}],['Tell Ravi to stay hidden while you carry his account.','office',{proof:1,trust:1}],['Threaten to expose Ravi unless he helps immediately.','office',{proof:2,trust:-2}]]},
grainrun:{title:'The Grain Cart',chapter:'The hidden landing',text:`You load sacks onto a small cart. The village needs food now, but a guard sees you moving the grain and calls for help. You can save the grain or try to escape with proof of the diversion.`,choices:[['Leave the cart and run with a marked sack.','escape',{proof:2}],['Keep pushing the cart toward the village.','chase',{food:2}],['Explain that the sacks are marked for hungry villagers.','guard',{trust:1}]]},
guard:{title:'A Guard Who Listens',chapter:'The hidden landing',text:`The guard sees the village mark. He looks uncomfortable. “My orders came from Vira,” he says. “I don't decide where supplies go.” He allows you to leave with one sack but refuses to release the rest without an official order.`,choices:[['Take the sack to Devika, the district investigator.','office',{proof:2,trust:1}],['Bring the sack home to feed your family.','foodEnd',{food:2}],['Sneak back later for the other sacks.','night',{proof:1}]]},
chase:{title:'The Cart Takes a Wrong Turn',chapter:'Danger on the road',text:`The overloaded cart hits a rut. Grain spills across the road. Guards approach from behind, and the riverbank drops sharply to your left.`,choices:[['Abandon the grain and hide behind the trees.','escape',{food:-1}],['Try to push the cart down the steep bank.','fallEnd',{injury:2}],['Stop and ask the guards to check the village marks.','guard',{trust:1}]]},
escape:{title:'Back with Evidence',chapter:'The road to town',text:`You escape the landing carrying a marked sack or a witness account. Mira is exhausted and covered in grain dust. “I hope Arun appreciates how much walking his innocence requires.”\n\nYou could bring what you found to the district office—or use it to persuade the village to demand food immediately.`,choices:[['Present your evidence to Devika at the district office.','office',{trust:1}],['Gather villagers to request the grain together.','petition',{trust:1}],['Avoid the officials and return home with what you have.','quietEnd',{}]]},

office:{title:'Meet Devika, the District Investigator',chapter:'The district office',text:`At the district office you meet Devika, a senior official assigned to investigate disputes over government supplies. She is not a judge in a modern courtroom: she reviews records, questions witnesses, and recommends what officials should do.\n\nYour brother Arun is being held nearby because the delivery tally bears his mark. He insists he counted the sacks correctly and warned his supervisor when the numbers changed.\n\nDevika explains the stakes: “If you can show that grain was diverted or records were altered, I can review Arun's accusation and request the grain be released. But I need evidence, not just anger.”`,choices:[['Ask to speak with Arun before making a decision.','arun',{trust:1}],['Ask Devika to compare the official grain records.','records',{proof:1}],['Tell Devika what you know and request an immediate hearing.','hearing',{trust:1}]]},
arun:{title:'Your Brother’s Side',chapter:'The district office',text:`Arun looks tired but relieved to see you. “I counted twelve carts,” he says. “The supervisor Vira told me to mark them delivered. I refused. The next morning, someone changed the tally and blamed me.”\n\nArun begs you not to risk your life. “If you can find the original tally or a witness, Devika may believe me. But our neighbors need food, too.”`,choices:[['Search the depot for the original tally.','depot',{proof:1}],['Find Jaya, a trader who knows the grain barges.','market',{proof:1}],['Tell Devika Arun’s account and ask her to investigate.','hearing',{proof:1,trust:1}]]},
records:{title:'Two Tallies, Two Stories',chapter:'The district office',text:`Devika shows you a copy of the government record. It says the grain reached your village. But the village elder's receipt is missing, and Arun's mark appears beside a number he says he never approved.\n\n“Someone may have made a mistake,” Devika says, “or someone may be hiding something. We cannot know which without checking.”`,choices:[['Inspect the riverside depot where Arun worked.','depot',{proof:1}],['Find a trader who saw the grain barge leave.','market',{proof:1}],['Request a hearing with the evidence you already have.','hearing',{trust:1}]]},
depot:{title:'The Government Storehouse',chapter:'The depot',text:`The riverside depot is busy with carts and laborers. You know Arun counted grain here. A young clerk points to a scratched-out entry in the tally book: sacks marked for your village were sent downstream instead.\n\nBefore you can copy it, Vira—the red-sashed official supervising shipments—steps into the doorway. “Why are you looking at my records?” he asks.`,choices:[['Calmly ask Vira to explain the changed entry.','vira',{trust:1}],['Copy the scratched-out number while he is distracted.','copy',{proof:2}],['Leave and tell Devika where to inspect.','hearing',{proof:1,trust:1}]]},
vira:{title:'An Official with an Answer',chapter:'The depot',text:`Vira says the grain was redirected because the river route was unsafe. “Your brother misunderstood my orders,” he insists.\n\nHis explanation might be true. But if the grain was redirected, why did the record say it arrived at your village?`,choices:[['Ask for a written order showing the diversion.','copy',{proof:1,trust:1}],['Accept his explanation and go home.','quietEnd',{}],['Accuse him loudly of stealing and demand his arrest.','crowd',{trust:-1}]]},
copy:{title:'The Scratched-Out Entry',chapter:'The depot',text:`You manage to copy the disputed tally. It shows a shipment moved downstream after Arun counted it. This doesn't prove who ordered the diversion, but it does cast doubt on the accusation against your brother.\n\nA guard spots the copied numbers and blocks your way.`,choices:[['Explain that Devika requested evidence for the inquiry.','hearing',{proof:2,trust:1}],['Run through the narrow alley behind the depot.','alley',{proof:2}],['Hand over the copy and ask the guard to escort you to Devika.','hearing',{proof:1,trust:1}]]},
alley:{title:'A Dangerous Shortcut',chapter:'Danger',text:`You race into a narrow alley with the guard behind you. The only shortcut is a crumbling wall overlooking a steep drop. Mira calls, “I have an excellent idea: stop running!”`,choices:[['Stop and ask to be taken to Devika.','hearing',{trust:1}],['Climb the unstable wall to escape.','fallEnd',{injury:2}],['Duck into the market crowd and find Jaya.','market',{proof:1}]]},
petition:{title:'The Village Speaks',chapter:'The district town',text:`You gather villagers who never received the promised grain. They carry empty bowls as a peaceful request for help. Some want the grain released immediately; others want Arun cleared first.\n\nDevika agrees to hear their statements, but warns that accusing someone without checking facts could punish innocent workers.`,choices:[['Present the villagers’ statements at a formal hearing.','hearing',{proof:1,trust:2}],['Demand the crowd seize the grain depot.','crowd',{trust:-2}],['Return home and organize food sharing instead.','villageEnd',{trust:1}]]},
crowd:{title:'Anger in the Market',chapter:'Danger',text:`A crowd gathers around the depot. Someone shouts that all the workers are thieves. Arun is still under accusation, and innocent laborers may be blamed for the missing grain. A loaded cart lurches as people push forward.`,choices:[['Calm the crowd and request an investigation.','hearing',{trust:1}],['Lead the rush toward the grain cart.','riotEnd',{injury:2}],['Leave before anyone is hurt.','quietEnd',{}]]},
hearing:{title:'The Inquiry into Arun’s Accusation',chapter:'The district office',text:()=>`Devika, the district investigator responsible for reviewing disputed supply records, gathers Arun, the depot clerk, and anyone willing to speak. This is an inquiry into two questions: Did Arun steal the grain? And why did your village never receive it?\n\nVira insists that the records are correct. Arun says they were changed after he counted the shipment. ${s.proof>=5?'You have several strong clues: records, witnesses, or marked sacks that contradict the delivery report.':s.proof>=2?'You have some useful evidence, but parts of the story remain uncertain.':'You have mostly your brother’s word and the village’s missing grain; Devika needs more to verify what happened.'}\n\nDevika asks you what should happen next.`,choices:[['Ask Devika to inspect the depot and clear Arun if the records were altered.','verdict',{trust:1}],['Ask her to release grain to hungry families while the inquiry continues.','relief',{trust:1}],['Demand that Vira be punished immediately, without further checks.','punish',{trust:-1}]]},
relief:{title:'Food Cannot Wait',chapter:'The decision',text:`Devika agrees to request emergency grain for the village while the records are checked. She warns that an investigation may take time and that Arun's accusation cannot be dismissed without examining the tally.`,choices:[['Stay to help verify the records and defend Arun.','verdict',{proof:1,trust:1}],['Escort the emergency grain home to feed the village.','foodEnd',{food:2,trust:1}],['Leave the inquiry to Devika and return to your family.','quietEnd',{trust:1}]]},
punish:{title:'Justice Needs Evidence',chapter:'The decision',text:`Devika refuses to punish Vira on accusation alone. “The emperor's ideals of fair conduct mean little if we ignore fairness when we are angry,” she says.\n\nMira mutters, “I hate when grown-ups make a reasonable point at an inconvenient time.”`,choices:[['Agree to an inspection and a careful decision.','verdict',{trust:1}],['Walk away and focus on feeding your village.','foodEnd',{food:1}],['Stir up a crowd outside the office.','crowd',{trust:-2}]]},
verdict:{title:'The Records Tell Their Story',chapter:'Your ending',end:true,text:()=>s.proof>=5&&s.trust>=1?`Devika's inspection confirms that grain was diverted and Arun's tally was changed after he counted it. The accusation against Arun is withdrawn. Officials begin recovering the grain for the villages, and Vira's actions are investigated.\n\nArun comes home to a relieved family. Mira announces that she is retiring from detective work until after dinner.\n\nYOU SURVIVED — AND CLEARED YOUR BROTHER'S NAME.`:s.proof>=2?`Devika finds enough inconsistencies to suspend the accusation against Arun while she orders a full inspection. Your brother is allowed to return home pending the inquiry, but the missing grain has not all been recovered.\n\nYou helped your family, even though the empire's paperwork still has a long way to go.\n\nYOU SURVIVED — WITH THE INVESTIGATION STILL OPEN.`:`Devika listens carefully, but there is not enough verifiable evidence to dismiss the accusation against Arun yet. She orders the records reviewed and promises to question the depot workers.\n\nYou return home alive, but your brother must wait for answers.\n\nYOU SURVIVED — BUT ARUN STILL NEEDS YOUR HELP.`,note:'Historical connection: Asoka’s inscriptions emphasized ethical conduct and concern for people. The characters, missing grain, and inquiry are fictional.'},
foodEnd:{title:'The Village Eats Tonight',chapter:'Your ending',end:true,text:`You return with food or help secure supplies for the village. Families who feared another hungry night finally have something to cook.\n\nBut Arun's accusation is not fully resolved. Your mother hugs you and then asks the question you've been avoiding: “When can your brother come home?”\n\nYou saved lives today, but the larger problem remains.\n\nYOU SURVIVED — AND HELPED FEED YOUR VILLAGE.`,note:'Historical connection: Farming, grain storage, and river transport mattered greatly to communities in the Mauryan Empire. This incident is fictional.'},
villageEnd:{title:'The Strength of Neighbors',chapter:'Your ending',end:true,text:`You stay with your village, organizing shared meals and helping families stretch their supplies. People survive the shortage together.\n\nYou have not discovered what happened to the missing shipment, and Arun remains under investigation. You made one important choice: no neighbor would face hunger alone.\n\nYOU SURVIVED — BY HELPING YOUR COMMUNITY.`,note:'Historical connection: Village agriculture and local cooperation were central to daily life. This story is fictional.'},
quietEnd:{title:'A Choice to Come Home',chapter:'Your ending',end:true,text:`You decide that another dangerous night away could leave your family with even less. You return home.\n\nArun's accusation remains unresolved, and the promised grain has still not reached everyone. You are safe, but the question of what happened will follow you for a long time.\n\nYOU SURVIVED — BUT THE MYSTERY REMAINS.`,note:'Historical connection: Imperial administration depended on local officials; the characters and events here are fictional.'},
bridgeEnd:{title:'The Broken Bridge',chapter:'Your ending',end:true,text:`You leap as the bridge collapses. The current carries you away before anyone can reach you. Chutki survives and spends the evening stealing bananas, entirely unaware of the tragedy.\n\nYOU DID NOT SURVIVE.`,note:'Historical connection: Rivers and bridges could be dangerous. This incident is fictional.'},
riverEnd:{title:'The River Takes Its Toll',chapter:'Your ending',end:true,text:`The fast current pulls you under before you can reach the bank. Your companions survive, but the investigation must continue without you.\n\nYOU DID NOT SURVIVE.`,note:'Historical connection: River transport connected settlements but carried risks. This incident is fictional.'},
fallEnd:{title:'The Shortcut Ends Here',chapter:'Your ending',end:true,text:`The unstable wall or riverbank gives way. You fall before Mira can pull you to safety.\n\nYOU DID NOT SURVIVE.`,note:'Historical connection: Storehouses and roads supported trade and administration. This accident is fictional.'},
riotEnd:{title:'The Crowd Breaks',chapter:'Your ending',end:true,text:`The crowd surges forward. A heavy grain cart overturns, and you are fatally injured in the confusion. The villagers still need food, and Arun's name has not been cleared.\n\nYOU DID NOT SURVIVE.`,note:'Historical connection: The importance of fair conduct is a theme of Asoka’s inscriptions. This event is fictional.'}
};
// A branch may reconnect with another route, but never replay a scene already visited.
// When a route reconnects, the player advances to a fresh consequence instead.
const reconnect={
 office:[['Bring your findings directly to Devika’s inquiry.','hearing'],['Ask for a final decision about Arun.','verdict']],
 market:[['Take what you learned from Jaya to the district inquiry.','hearing'],['Return home with your discoveries.','quietEnd']],
 landing:[['Leave the dangerous landing with the evidence you have.','escape'],['Bring your evidence to the inquiry.','hearing']],
 night:[['Give up the dangerous nighttime search and report what you found.','office'],['Return home rather than risk another river crossing.','quietEnd']],
 guard:[['Leave the guards and bring your information to the investigator.','office'],['Return home safely with what you know.','quietEnd']],
 crowd:[['Step away from the angry crowd and seek a fair decision.','hearing'],['Leave the unrest and return home.','quietEnd']],
 depot:[['Take the information from the depot to the investigator.','hearing'],['Go home rather than confront the officials again.','quietEnd']],
 hearing:[['Ask Devika to reach a decision using the available evidence.','verdict']],
 escape:[['Present your evidence to the district investigator.','office'],['Go home with the information you have.','quietEnd']]
};
function freshChoice(label,next,delta){
 if(!s.seen.includes(next))return [label,next,delta];
 const candidates=[...(reconnect[next]||[]),['Request a final review of Arun’s accusation.','hearing'],['Accept the consequences and return home.','quietEnd'],['Ask Devika to decide what the evidence proves.','verdict']];
 for(const [alternative,target] of candidates){if(!s.seen.includes(target))return [alternative,target,delta];}
 return ['Finish your journey and reflect on your choices.','quietEnd',{}];
}
function change(delta){if(!delta)return;for(const [k,v] of Object.entries(delta)){if(typeof v==='number')s[k]=(s[k]||0)+v;else s[k]=v;}s.food=Math.max(0,s.food);s.coins=Math.max(0,s.coins)}
function go(id,delta){if(!N[id]){console.error('Unknown scene',id);return;}if(s.seen.includes(id)){console.error('Prevented repeated scene',id);return;}change(delta);s.chapter++;s.seen.push(id);const n=N[id];$('title').textContent=n.title;$('eyebrow').textContent='Mauryan Empire · c. 250 BCE';$('chapter').textContent=n.chapter;$('story').textContent=typeof n.text==='function'?n.text():n.text;$('story').classList.toggle('end',!!n.end);$('note').classList.toggle('hide',!n.note);$('note').textContent=n.note||'';const root=$('choices');root.replaceChildren();if(n.end){const b=document.createElement('button');b.className='choice';b.textContent='↻ Try a different path';b.onclick=reset;root.appendChild(b)}else{n.choices.forEach(([label,next,d])=>{const [shown,target,effect]=freshChoice(label,next,d);const b=document.createElement('button');b.className='choice';b.textContent=shown;b.onclick=()=>go(target,effect);root.appendChild(b)})}window.scrollTo({top:0,behavior:'instant'})}
function reset(){s=initial();go('start')} $('restart').onclick=reset;reset();
</script></body></html>
