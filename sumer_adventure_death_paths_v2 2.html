<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Would You Survive Ancient Sumer?</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#29241d;background:#eee8da}*{box-sizing:border-box}body{margin:0;padding:20px}.game{max-width:760px;margin:0 auto;background:#fffdf7;border:1px solid #d6c8ad;border-radius:18px;overflow:hidden;box-shadow:0 8px 35px #47371b17}.top{background:#352e25;color:#f6ecd7;padding:23px 28px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#d8c69d;font-weight:750}.top h1{font-size:clamp(25px,5vw,36px);margin:8px 0}.top small{color:#e1d2b4}.content{padding:27px;min-height:360px}.scene{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#856c3e;font-weight:750}.title{font-size:clamp(24px,4vw,31px);margin:10px 0 17px}.story{font-size:17px;line-height:1.78;white-space:pre-line}.quote{border-left:4px solid #a88343;padding:9px 15px;background:#f7f1e5;margin:20px 0;font-style:italic;line-height:1.6}.choice{display:block;width:100%;text-align:left;border:1px solid #cfc2aa;border-radius:12px;background:#fff;padding:17px 18px;margin:12px 0;font-size:15px;line-height:1.5;color:#29241d;cursor:pointer}.choice:hover,.choice:focus{border-color:#92682d;background:#f8f0e2;outline:none}.choice strong{color:#805d2b;margin-right:8px}.button{border:0;background:#4a3927;color:white;border-radius:10px;padding:14px 19px;font-weight:700;font-size:15px;cursor:pointer;margin-top:10px}.button:hover{background:#6c502e}.muted{color:#756b5c;font-size:13px}.footer{padding:12px 27px;border-top:1px solid #e6ddce;display:flex;justify-content:space-between;gap:10px;color:#776b5a;font-size:12px}.dots{display:flex;gap:5px;margin:12px 0}.dots span{height:5px;background:#e1d5bf;flex:1;border-radius:8px}.dots span.active{background:#97733e}.ending{font-size:46px;text-align:center}.journal{border-top:1px solid #e4dac9;padding:12px 0;font-size:14px;line-height:1.6}.journal strong{display:block}.history{background:#f5f0e6;padding:15px;border-radius:10px;font-size:14px;line-height:1.65}.secondary{background:#f5efe5;color:#3c3021;border:1px solid #b9a88b;margin-left:8px}.art{font-size:50px;margin:16px 0}button:focus-visible{outline:3px solid #bd8c39;outline-offset:2px}@media(max-width:550px){body{padding:8px}.content{padding:19px}.top{padding:20px}.story{font-size:16px}.footer{padding:12px 19px}}.finalhero{text-align:center;padding:20px 14px;background:#f5eddd;border-radius:13px}.finalhero .ending{font-size:62px;margin:10px}.finalsubtitle{line-height:1.6}.epilogue{margin:20px 0}.epilogue h3,.fate h3{margin-bottom:8px}.fate{padding:18px;background:#eee3cd;border:1px solid #d3b98a;border-radius:12px;margin:18px 0}.fate h3{font-size:23px}.replay{margin:20px 0}.history{margin:12px 0}.history summary{cursor:pointer;font-weight:700}</style></head><body><main class="game"><header class="top"><div class="eyebrow">Historical survival adventure</div><h1>Would You Survive Ancient Sumer?</h1><small>The Year Everything Went Wrong · Near Ur, around 2500 BC</small></header><section id="screen" class="content" aria-live="polite"></section><footer class="footer"><span id="chapter">A new life awaits</span><span>Every choice changes your story</span></footer></main><script>
(()=>{'use strict';const screen=document.getElementById('screen'),chapterLabel=document.getElementById('chapter');let s,history,visits,seed=0,sceneId='intro';const init=()=>{s={food:5,tools:1,trust:1,health:5,copper:0,goat:false,friend:false,merchant:false,seedGrain:false,canal:false,brother:false,place:'farm'};history=[];visits=0;sceneId='intro';render()};const add=(changes={})=>{for(const [k,v] of Object.entries(changes)){if(typeof v==='number')s[k]=Math.max(0,Math.min(10,(s[k]||0)+v));else s[k]=v}};const luck=(salt)=>{let x=Math.sin((seed+1)*53.1+visits*41.73+salt*19.91)*43758.5453;return x-Math.floor(x)};const scene=(title,story,choices,emoji='🏺')=>({title,story,choices,emoji});const choice=(text,next,changes={},result='',condition=null)=>({text,next,changes,result,condition});function getNodes(){return {
intro:scene('The Year Everything Went Wrong',`You live on a barley farm outside the Sumerian city-state of Ur. Your family depends on the next harvest. Your tools are wearing out, your food stores are modest, and your younger brother Naram believes he is a financial genius.\n\nYour neighbor Tali has a different opinion.\n\n“Nothing exciting ever happens here,” Naram announces.\n\nThis is an unfortunate thing to say.`,[choice('Begin your year in Sumer.','merchant')], '🌾'),
merchant:scene('A Deal Before Sunset',`A traveling merchant named Bel-ili arrives at your farm. You have seen him selling copper in the marketplace, but have never dealt with him before. Today he has copper for sale. He offers enough to repair your farming tools, but wants several sacks of barley. He says he must leave before sunset.\n\nNaram urges you to buy. Tali suggests sharing the cost. You have to decide before the trader leaves.`,[choice('Trade much of your barley for copper.','tradeRoad',{food:-2,copper:2,merchant:true},'You now own useful copper, but your grain jars look alarmingly empty.'),choice('Keep the grain and repair the old tools yourself.','fieldWork',{food:2,seedGrain:true},'Bel-ili leaves. Naram says you have no imagination. You still have food.'),choice('Ask Tali to split the cost and share the tools.','waterCouncil',{food:-1,tools:1,trust:2,friend:true},'Tali agrees, on the condition that you help when her household needs it.')],'⚖️'),
tradeRoad:scene('A Problem with the Barley',`The copper you bought from Bel-ili, the traveling merchant, is genuine. Unfortunately, your family now has less barley than it needs for a comfortable year. He offers you work escorting a small trading party toward a river landing. He'll pay in grain.\n\nNaram volunteers immediately, which does not inspire confidence.`,[choice('Travel with Bel-ili and earn barley.','caravan',{merchant:true},'You join the trading party, leaving Tali to watch the farm.'),choice('Ask a temple administrator about exchanging work for rations.','temple',{trust:-1},'You head toward the city, hoping there is work available.'),choice('Stay home and stretch the remaining food.','thinStores',{food:-1},'You stay on the farm and begin rationing your grain.')],'🧺'),
fieldWork:scene('The Tool That Would Not Cooperate',`You kept the barley, but your old hoe breaks while you clear a field. Naram suggests borrowing Tali's equipment without asking.\n\nMeanwhile, workers warn that the irrigation channel is filling with silt. Without water, your carefully saved seed will do little good.`,[choice('Ask Tali for help and offer to work on the shared canal.','waterCouncil',{trust:2,friend:true},'Tali agrees, and you join the other farmers.'),choice('Try to repair the hoe yourself and focus on your own land.','brokenTool',{tools:-1},'You spend days working with an unreliable tool.'),choice('Use some saved barley to hire a craftsperson.','craftsman',{food:-2,tools:2},'A craftsperson agrees to help, but the repair is expensive.')],'🪓'),
waterCouncil:scene('Who Owns the Water?',`At the irrigation canal, you find Tali arguing with a farmer upstream. His household has diverted extra water to its fields. The downstream farmers say their crops will fail.\n\nAn official from Ur may settle the dispute, but nobody knows when he can come.`,[choice('Help organize a shared water schedule.','canalWork',{trust:2,friend:true,canal:true},'The families reluctantly agree to try a schedule.'),choice('Support the upstream farmer in exchange for access to his water.','upstream',{food:1,trust:-2},'Your field may get more water. Tali looks betrayed.'),choice('Take the dispute to an official in Ur.','official',{food:-1},'You travel to the city, hoping someone will hear the complaint.')],'💧'),
caravan:scene('The Missing Donkey',`You and Bel-ili's trading party camp beside a canal. At dawn, one donkey is missing, along with a bundle of goods. Bel-ili, the merchant who hired you, suspects a thief. Naram insists the donkey has simply “gone exploring.”\n\nA dust cloud on the road suggests other travelers are approaching.`,[choice('Follow tracks toward the river before they disappear.','riverCrossing',{health:-1},'You follow the tracks away from the camp.'),choice('Stay with the cargo and question the approaching travelers.','travelers',{trust:1},'You prepare to meet the strangers.'),choice('Leave the expedition and return to your family.','returnHome',{food:-1},'Bel-ili is furious, but you decide the journey is too risky.')],'🐪'),
temple:scene('Work in the City',`A temple administrator can offer grain rations for labor. The work involves carrying baskets of earth for a canal project. Your family would receive food, but you would be away from your fields.\n\nNaram says he could supervise. The administrator does not look convinced.`,[choice('Take the work and send the rations home.','labor',{food:3,health:-1},'The work is hard, but your family receives grain.'),choice('Offer your copper in exchange for grain instead.','thinStores',{copper:-2,food:3},'You secure food, but sacrifice the copper you hoped would improve your tools.'),choice('Return to your farm before the planting season is lost.','returnHome',{food:-1},'You head home, hoping your fields are still manageable.')],'🏛️'),
thinStores:scene('The Empty Storage Jar',`Your family is eating less each day. Naram quietly admits he gave some barley to a neighbor whose children were hungry.\n\nYou are angry, but you also know the neighbor's family is struggling. A poor planting season could make things worse.`,[choice('Ask Tali and the neighbors to share labor and supplies.','neighbors',{trust:2,friend:true},'You approach the people who know your family best.'),choice('Trade your remaining copper or tools for grain.','lastTrade',{food:2,tools:-1,copper:-1},'You gain food but lose equipment you may need later.'),choice('Plant what seed remains and hope for a good growing season.','dryFields',{food:-1,seedGrain:true},'You risk the last of your seed on the fields.')],'🥣'),
brokenTool:scene('A Bad Day in the Field',`The repaired hoe breaks again. Naram suggests borrowing a donkey to help with the work. You remind him that finding one to borrow is not quite so simple.\n\nTali warns that water levels in the canal are falling.`,[choice('Join the communal canal repairs and borrow tools.','canalWork',{trust:2,friend:true,canal:true},'Neighbors agree to help once you join their work.'),choice('Trade some barley for replacement equipment.','craftsman',{food:-2,tools:2},'You decide that reliable tools are worth the cost.'),choice('Continue with the old tools and hope the rains help.','dryFields',{health:-1},'You continue working, but the field is not ready on time.')],'🪓'),
craftsman:scene('The Craftsperson’s Warning',`The repaired equipment works well. While working, the craftsperson mentions that several upstream canal gates are damaged. If they fail, some fields may flood while others dry out.\n\nNaram suggests buying another tool. You remind him that tools cost barley.`,[choice('Take your tools to help repair the gates.','canalWork',{canal:true,trust:2,friend:true},'The farmers are glad to see you arrive with working equipment.'),choice('Concentrate on planting your own fields first.','dryFields',{food:1},'Your fields are planted, but the canal remains unreliable.'),choice('Travel to Ur to seek help from an official.','official',{food:-1},'You leave the fields in Naram’s care and head for the city.')],'🔨'),
upstream:scene('An Unpopular Agreement',`The upstream farmer gives your field extra water. Your barley looks promising. But downstream crops begin to wilt, and Tali refuses to speak to you.\n\nAt night, someone damages a small diversion gate. The canal begins leaking.`,[choice('Admit the arrangement was unfair and help repair the canal.','canalWork',{trust:2,canal:true},'Some neighbors accept your help, though trust will take time to rebuild.'),choice('Protect your own water access and refuse to get involved.','isolated',{food:1,trust:-2},'Your crops may survive, but your neighbors are angry.'),choice('Ask an official to resolve the dispute.','official',{food:-1},'You travel to Ur before the argument becomes worse.')],'🚰'),
official:scene('Waiting in Ur',`The official listens to the canal dispute, but other matters demand his attention. He asks whether the families can settle it themselves.\n\nWhile you wait, you hear rumors of armed men from a rival city-state near the outer farms.`,[choice('Return and negotiate directly with the farmers.','canalWork',{trust:2,canal:true},'You return to help organize repairs and water sharing.'),choice('Remain in the city to seek protection and paid work.','cityWork',{food:1},'You find work inside the city walls.'),choice('Hurry home to warn your family about the soldiers.','warning',{health:1},'You leave immediately to bring the warning home.')],'📜'),
canalWork:scene('The Bank Gives Way',`The farmers have nearly finished clearing the canal when a section of bank collapses. Water rushes toward the lower fields.\n\nTali calls for everyone to move earth and stones. Naram has vanished. You spot him helping another farmer move sacks of barley out of the water. “I am supervising the rescue!” Naram shouts, while carrying the smallest sack.`,[choice('Help the farmers strengthen the bank.','savedCanal',{canal:true,trust:2,health:-1},'The farmers work together, buying precious time.'),choice('Help Tali move families and animals to higher ground.','evacuation',{health:1,trust:1},'You help people escape before the water spreads.'),choice('Run to protect your family’s stored barley.','floodPeril',{food:2,health:-2},'You race home to protect your food reserves.')],'🌊'),
riverCrossing:scene('A Dangerous Crossing',`You find the donkey beside a narrow river crossing. Its rope is tangled around a fallen branch. The missing goods are nearby, but the current is swift.\n\nThe workers from Bel-ili's trading party are still some distance behind you.`,[choice('Wait for the workers and use ropes to recover the goods.','caravanReward',{food:2,trust:1},'Together you retrieve most of the cargo, although some is lost.'),choice('Wade in immediately to rescue the donkey.','riverPeril',{health:-2},'The current is stronger than you expected.'),choice('Leave the goods and return to the trading party.','travelers',{health:1},'You decide that no bundle is worth your life.')],'🌊'),
travelers:scene('Strangers on the Road',`You and Bel-ili encounter travelers who turn out to be merchants from another city. They offer information about a safer route home, but ask for a share of your remaining supplies. Bel-ili suspects they are exaggerating the danger.`,[choice('Pay for their guidance and take the safer route.','caravanReward',{food:1,trust:1},'The route is longer but avoids a flooded crossing.'),choice('Follow Bel-ili on the shorter road.','riverRisk',{food:2,health:-1},'You save time but encounter dangerous water.'),choice('Part ways and return home independently.','returnHome',{food:-1},'You begin a difficult journey back to the farm.')],'🧭'),
labor:scene('The Price of a Ration',`The canal work pays grain, but you have been away from your farm for weeks. A messenger says Tali has been helping your family. Another says soldiers may be moving near the outer fields.`,[choice('Return home with the grain you earned.','returnHome',{food:1,trust:1},'You carry the grain home, grateful for the help your family received.'),choice('Remain in Ur, where the walls may offer safety.','cityWork',{food:1,health:1},'You decide the city is safer for now.'),choice('Send the grain home and join a repair crew near the farms.','canalWork',{food:-1,canal:true,trust:1},'You return to the countryside to help protect the fields.')],'🧱'),
neighbors:scene('A Favor Remembered',`Tali gathers several households. They agree to share labor, but everyone is short of supplies. Naram announces that he has an idea. A neighbor is offering to trade a young goat for household goods. Naram wants to make the exchange, claiming the animal could provide milk in the future. Tali points out that a goat would also need feeding. You have not agreed to the trade yet.`,[choice('Agree to trade household goods for the goat and raise it.','goatTrouble',{goat:true,food:-1,trust:1},'Naram brings home the goat and proudly names it King of Ur. It immediately eats a basket.'),choice('Help the neighbor find another buyer and negotiate barley seed in return for your assistance.','seedDeal',{food:2,seedGrain:true},'Naram is disappointed that you did not bring home a goat, but the neighbor rewards your help with barley seed.'),choice('Skip the goat deal and offer your labor to neighbors.','canalWork',{trust:2,canal:true},'Your neighbors agree to exchange help with the canal for assistance in your fields.')],'🐐'),
lastTrade:scene('A Costly Bargain',`You have food for now, but the next planting season is approaching. Your equipment is poor, and the canal needs repairs. Naram says he knows someone who can lend farming equipment.`,[choice('Ask Tali for shared tools and help.','neighbors',{trust:2,friend:true},'You decide cooperation is better than another desperate trade.'),choice('Try planting with the equipment you have.','dryFields',{seedGrain:true},'You prepare the fields as best you can.'),choice('Take work in Ur to rebuild your reserves.','cityWork',{food:2},'You leave the farm temporarily to earn food.')],'⚖️'),
dryFields:scene('A Field Without Water',`The barley has sprouted unevenly. Some plants are drying out because the irrigation canal is unreliable. Your remaining seed will not be enough to replant everything.`,[choice('Work with neighbors to clear the canal before it is too late.','canalWork',{trust:2,canal:true},'You join a work crew and try to restore the water supply.'),choice('Plant a smaller area near the remaining water.','smallHarvest',{food:1},'You concentrate your efforts on a smaller, more reliable plot.'),choice('Abandon the crop and seek work inside Ur.','cityWork',{food:1},'You leave the failing fields to find another way to feed the family.')],'🌱'),
isolated:scene('No One Comes to Help',`The canal is leaking again, and the neighboring farmers refuse to work on your section. Tali reminds you that you supported the diversion that harmed their fields.\n\nNow a messenger warns that armed men have been seen near the city-state's border.`,[choice('Apologize and offer to help repair the shared canal.','canalWork',{trust:3,canal:true},'Some farmers cautiously accept your offer.'),choice('Take your household toward Ur’s walls.','cityWork',{food:-1,health:1},'You leave the farm, unsure whether you can return.'),choice('Stay and guard your field against both threats.','raidFarm',{health:-2,food:1},'You remain on the farm despite the danger.')],'🚧'),
warning:scene('The Messenger Reaches Home',`You reach the farm and warn Tali and Naram about the possible raid. Some families begin packing. Others say the rumors are exaggerated.`,[choice('Lead the households toward Ur’s city walls.','cityRefuge',{food:-2,health:2},'You help several families reach the city.'),choice('Travel with Tali to relatives in another settlement.','relatives',{food:-2,trust:1},'You set out together before the roads become dangerous.'),choice('Stay to protect the farm and wait for news.','raidFarm',{health:-2,food:1},'You decide to risk staying near the fields.')],'📣'),
savedCanal:scene('The Water Returns',`The repaired bank holds. Water begins flowing into the fields again. Tali thanks you, and even Naram admits that working together was useful.\n\nThen a messenger arrives with news of armed men near the outer farms.`,[choice('Stay to prepare the fields while keeping watch.','smallHarvest',{food:2,canal:true},'Your fields benefit from the restored water.'),choice('Warn nearby households and move toward Ur.','cityRefuge',{food:-1,trust:1},'You leave with other families for safety.'),choice('Ask Tali to travel with you to relatives.','relatives',{food:-2,trust:1},'You choose distance over uncertainty.')],'🌾'),
evacuation:scene('The Families on the Hill',`Everyone you helped reaches higher ground. Some stored grain is ruined, but the people and animals are safe. Tali thanks you for thinking of the families first.\n\nThe fields will need repair, and there are rumors of soldiers nearby.`,[choice('Return to the fields to salvage what you can.','smallHarvest',{food:1},'You return to damaged but workable land.'),choice('Seek shelter inside Ur until the danger passes.','cityRefuge',{food:-1,health:1},'You move toward the city walls.'),choice('Ask relatives in another settlement for help.','relatives',{food:-2,trust:1},'You travel away from the damaged fields.')],'⛰️'),
grainRescue:scene('The Storage Room',`You save much of the barley, but the floodwater reaches the house. Naram helps carry the last sacks. Tali arrives with a rope and a very angry expression.\n\n“Next time,” she says, “we save the people first.”`,[choice('Apologize and help repair the shared canal.','savedCanal',{trust:2,canal:true},'You join the work crew and help restore the water.'),choice('Keep your saved grain and prepare a smaller field.','smallHarvest',{food:2},'You focus on the next harvest.'),choice('Take the family toward Ur before the danger worsens.','cityRefuge',{food:-1,health:1},'You head for the city walls.')],'🏺'),
caravanReward:scene('Bel-ili Keeps His Promise',`Bel-ili, the copper merchant who hired you, pays you in barley for your work. You have survived a difficult journey and learned that trade can bring both opportunity and danger.\n\nWhen you return near Ur, you hear that the canals have been damaged.`,[choice('Bring your grain home and help restore the farm.','smallHarvest',{food:2},'You return with supplies your family badly needs.'),choice('Use your new contacts to begin trading instead of farming.','merchantEnding',{food:1,merchant:true},'You decide your future may lie beyond the fields.'),choice('Help Tali and the other farmers repair the canal.','savedCanal',{trust:2,canal:true},'You put your resources to work for the community.')],'🧺'),
riverRisk:scene('The River Takes Its Toll',`The river crossing is more dangerous than it appeared. Your group loses part of its cargo, and you are injured while escaping the current. Naram later claims he would have handled it better.`,[choice('Return home to recover and help your family.','returnHome',{health:-1},'You leave the trading expedition behind.'),choice('Continue the journey to earn enough grain to make it worthwhile.','merchantEnding',{food:2,health:-1},'You press on, hoping the risk will pay off.'),choice('Seek help in Ur rather than continue traveling.','cityWork',{food:1},'You find shelter and work while you recover.')],'🌊'),
returnHome:scene('The Farm You Left Behind',`You return to find Naram attempting to manage the farm. Tali has helped where she could. The irrigation canal is in poor condition, and your family needs to decide whether to rebuild or leave.`,[choice('Work with Tali to restore the shared canal.','savedCanal',{trust:2,canal:true},'You begin repairing the fields together.'),choice('Plant what you can and hope for a modest harvest.','smallHarvest',{food:1},'You focus on a small patch of barley.'),choice('Move the family into Ur and seek a different livelihood.','cityWork',{food:1},'You decide to begin again inside the city walls.')],'🏠'),
goatTrouble:scene('King of Ur Escapes',`Naram's goat, which he proudly named King of Ur after bringing it home, has eaten Tali's vegetables, escaped its enclosure, and frightened a child carrying water. Naram insists King of Ur is “a natural leader.”\n\nMeanwhile, the canal still needs work.`,[choice('Make Naram return the goat and help Tali repair the damage.','savedCanal',{trust:2,canal:true},'Naram spends the day repairing fences instead of making business plans.'),choice('Trade the goat for grain and focus on planting.','seedDeal',{food:2,seedGrain:true,goat:false},'King of Ur leaves. Naram says he will never recover.'),choice('Keep the goat and concentrate on your own farm.','smallHarvest',{food:-1},'The goat stays, but caring for it consumes supplies.')],'🐐'),
seedDeal:scene('The Seeds of a New Beginning',`You have secured barley seed. The canal is still unreliable, but there may be enough water to grow a modest crop. Naram is still sulking about the goat he wanted to bring home.`,[choice('Share the seed and labor with Tali’s household.','savedCanal',{trust:2,canal:true},'The households agree to help one another.'),choice('Plant your own small field near the remaining water.','smallHarvest',{food:2},'You put the seed into the best land available.'),choice('Trade some seed for a place in the city’s work crews.','cityWork',{food:1},'You decide that steady rations may be safer than another uncertain crop.')],'🌱'),
cityWork:scene('A New Life Behind the Walls',`Inside Ur, you find labor carrying goods and helping maintain public works. Food is available, but the city is crowded and your family misses the farm.\n\nNaram says he would make an excellent merchant. You are beginning to worry he might actually try.`,[choice('Stay in Ur and build a new livelihood.','cityEnding',{food:2,place:'city'},'You decide to settle in the city.'),choice('Return to the countryside and help Tali rebuild.','savedCanal',{trust:2,canal:true},'You return to the land you know.'),choice('Join a merchant caravan leaving the city.','merchantEnding',{food:1,merchant:true},'You choose the uncertain life of trade.')],'🏙️'),
cityRefuge:scene('Inside the City Walls',`Your family reaches Ur, where many people have sought shelter. The city offers protection, but grain is expensive and rooms are crowded. After several days, news arrives that the raiders have moved away.`,[choice('Return home and prepare the fields for harvest.','smallHarvest',{food:1},'You return to the farm.'),choice('Stay in Ur and seek regular work.','cityEnding',{food:1,place:'city'},'You decide to remain behind the walls.'),choice('Travel to relatives and start over elsewhere.','relatives',{food:-1},'You leave the city to seek a quieter life.')],'🛡️'),
relatives:scene('A Roof in Another Settlement',`Tali's relatives welcome your household, but they have limited grain. They can offer shelter and some work, not an endless supply of food. Your old farm may recover, but returning would mean another difficult journey.`,[choice('Help the relatives and settle here.','relativesEnding',{food:1,trust:2,place:'settlement'},'You decide to build a new life among relatives.'),choice('Return to Ur and rebuild your old farm.','smallHarvest',{food:-1},'You head back toward your damaged fields.'),choice('Seek work as a trader between settlements.','merchantEnding',{food:1,merchant:true},'You decide to make a living on the road.')],'🏘️'),
raidFarm:scene('The Night of the Raiders',`Armed men move across the outer fields. Your family hears shouting in the distance. You cannot tell whether the raiders intend to attack your farm or simply take supplies on their way past.`,[choice('Leave possessions behind and escape with your family.','escapeEnding',{food:-2,health:1},'You escape with your family but lose much of your property.'),choice('Hide the grain and remain near the house.','raidPeril',{health:-2,food:1},'You wait in fear as the raiders pass through the area.'),choice('Join neighboring families and head toward the city.','cityRefuge',{food:-1,trust:1},'You travel together toward Ur.')],'🔥'),
floodPeril:scene('The Storehouse Is Flooding',`You reach the storage room as muddy water pours through the doorway. Naram is outside calling for you to leave. You could still save a little barley, but the wall is cracking and the water is rising.`,[choice('Leave the barley and get outside before the wall fails.','evacuation',{food:-2,health:1},'You escape with Naram. The grain is lost, but your family is safe.'),choice('Climb onto the raised storage platform and wait for help.','grainRescue',{health:-2,food:1},'The wall holds just long enough for neighbors to help you down.'),choice('Stay inside to drag out the final heavy sacks.','floodDeath',{health:-5},'The weakened mudbrick wall collapses. You do not escape.')],'🌊'),
riverPeril:scene('The Current Pulls You Under',`You step into the river, but the muddy current is far stronger than it looked. The donkey pulls free and scrambles onto the bank. You are swept toward a submerged branch. Bel-ili's workers are running toward you, but they are still far away.`,[choice('Grab the branch and hold on until the workers arrive.','riverRisk',{health:-1},'You cling to the branch until the workers pull you out. You are hurt, but alive.'),choice('Try to swim directly across the strongest current.','riverDeath',{health:-4},'You fight the current, but it pulls you under before help can reach you.'),choice('Let the current carry you toward the shallow bend downstream.','riverRisk',{health:-2},'You reach the muddy bank exhausted and injured. The donkey watches from a safe distance.')],'🌊'),
raidPeril:scene('Footsteps Outside',`You stay behind to protect the barley. At night, armed raiders enter the farmyard. Naram and the rest of your household are hidden in a storage pit behind the house. A raider sees the door move and approaches.`,[choice('Leave the barley and slip out through the back to warn your family.','escapeEnding',{food:-2,health:1},'You abandon the grain and guide your family away before the raiders find them.'),choice('Step outside and try to bargain with the raiders for the safety of your family.','raidEnding',{food:-3,health:-1},'The raiders take the stored barley and leave. Your household survives, but has little food left.'),choice('Rush at the armed raider to defend the grain.','raidDeath',{health:-5},'You are struck during the struggle. Your family escapes, but you do not.')],'🔥'),
smallHarvest:scene('The Final Harvest',`Months later, you stand in the barley fields. The harvest is ${s.canal?'better than you feared because the irrigation channels were repaired':'uneven because water has been difficult to manage'}.\n\nYour household has survived an unpredictable year. Tali asks what you will do with the grain. Naram proposes an entirely new business venture. He refuses to explain the details.`,[choice('Keep seed and household food, then share any surplus.','farmEnding',{food:2,trust:1},'You prepare for the next planting season and help where you can.'),choice('Trade much of the harvest for better equipment.',s.food<=1&&s.trust<=1?'hungerDeath':'farmEnding',{food:-2,tools:2},'Your farm may be stronger next year, but you have fewer reserves.'),choice('Pool seed and labor with neighboring households.','communityEnding',{food:s.trust>=3?2:0,trust:2},'The families agree to try a shared plan for next year.')],'🌾'),
};}
const endings={floodDeath:['🕯️','Buried by the Flood','You stayed to rescue the last sacks of barley. The weakened storehouse collapsed, and your character did not survive. Naram and the rest of the household escaped.'],riverDeath:['🕯️','The River Claimed You','The river was stronger than you expected. Your character did not survive the crossing. Bel-ili returns to Ur and tells your family what happened.'],raidDeath:['🕯️','The Last Stand','You tried to defend the farm against armed raiders. Your character was killed, although Naram and the rest of your household escaped.'],hungerDeath:['🕯️','The Empty Storehouse','After repeated shortages and a failed harvest, your character did not survive the hunger that followed. The rest of the household must seek help elsewhere.'],farmEnding:['🌾','The Farmer Who Endured','You remain near Ur and prepare for another growing season. Your farm has changed, but it is still yours.'],communityEnding:['🤝','The Canal Builder','Your household becomes part of a network of families who share work and manage water together. Cooperation may be your greatest resource.'],merchantEnding:['🧺','The Traveling Trader','You leave farming behind for the risks and opportunities of trade. Naram announces that he will be your business partner. This may be your greatest challenge yet.'],cityEnding:['🏛️','A New Life in Ur','Your family begins again inside the city walls. You trade the uncertainties of farming for the challenges of urban life.'],relativesEnding:['🏘️','The Settlement Survivor','Your family starts over among relatives. You have left the old farm behind, but not the knowledge you gained.'],escapeEnding:['🛡️','The Family Protector','You lose possessions but get your household to safety. Survival sometimes means knowing what cannot be saved.'],raidEnding:['🍀','Just Plain Lucky','Your household survives a dangerous encounter, but the risk was enormous. Naram calls it bravery. Tali would probably disagree.']};
function button(text,fn,cls='button'){const b=document.createElement('button');b.className=cls;b.textContent=text;b.addEventListener('click',fn);return b}
function para(text,cls='story'){const p=document.createElement('p');p.className=cls;p.textContent=text;return p}
function endingStory(){
const starving=s.food<=1, injured=s.health<=1, supported=s.trust>=5||s.friend, prosperous=s.food>=6, isolated=s.trust<=1;
let fate, detail, badge;
if(starving&&injured){fate='The Year That Broke the Household';badge='🕯️';detail='The journey has left your household injured and almost out of food. Your family survives this chapter of the story, but must depend on others for shelter and supplies. There is no triumphant harvest this year.'}
else if(starving){fate='The Hungry Winter';badge='🥣';detail='You reach safety, but your barley jars are nearly empty. Naram counts the remaining meals twice. The next challenge is finding food before the household can begin again.'}
else if(injured){fate='The Cost of Survival';badge='🩹';detail='Your family has made it through the danger, but injuries make the work of rebuilding much harder. Tali reminds Naram that surviving is not the same as escaping without a cost.'}
else if(prosperous&&supported){fate='A Household Worth Celebrating';badge='🌟';detail='The family has food to spare and people willing to help. Naram proposes a feast. Tali agrees, on the condition that he does not organize it.'}
else if(prosperous){fate='Barley in the Storehouse';badge='🏺';detail='Your grain stores are healthy, giving the household a chance to plan beyond the next meal. Naram immediately proposes spending it all. You decline.'}
else if(supported){fate='The Neighbors Remember';badge='🤝';detail='You do not have everything you need, but you are not facing the future alone. People you helped earlier now offer labor, advice, or a place at their table.'}
else if(isolated){fate='Alive, but on Your Own';badge='🌒';detail='Your household survives, but few neighbors are eager to lend a hand. Rebuilding will require hard work and perhaps repairing more than the farm.'}
else{fate='Another Season, Another Chance';badge='🌱';detail='You have enough to continue, though little to spare. Your family gathers around the evening meal and begins planning for what comes next.'}
const places={farmEnding:'You return to the familiar fields outside Ur. The canals still need attention, and the next planting season will test what you learned.',communityEnding:'Your work on the shared canals changes how neighboring households treat one another. People begin coming to you when water disputes arise.',merchantEnding:'The road has become your livelihood. Each new market offers a chance at profit—and the possibility of coming home with less than you carried.',cityEnding:'Your household makes a new home inside Ur. The crowded streets offer opportunities, but you must find work and buy or trade for food.',relativesEnding:'Your relatives welcome you into their settlement. You are safe for now, but starting over means adjusting to another household’s ways.',escapeEnding:'You leave possessions behind and lead your household away from danger. You may not return to the same farm, but you have a chance to rebuild.',raidEnding:'You survive a frightening encounter with armed men. Your household has escaped, but the memory of that night will stay with you.'};
let callback='';
if(s.goat)callback='King of Ur, the goat Naram acquired, survives as well. He promptly eats something important.';
else if(s.brother)callback='Naram claims he knew things would work out. No one asks him to explain.';
else if(s.friend)callback='Tali visits your family before the season ends. Whatever happens next, you have an ally.';
else callback='Naram is already working on his next idea. Your family insists on hearing the details first.';
return {fate,detail,badge,place:places[sceneId]||places.farmEnding,callback};
}
function render(){screen.replaceChildren();chapterLabel.textContent=sceneId==='intro'?'A new life awaits':`Scenes experienced: ${visits}`;if(endings[sceneId]){
const [emoji,title,description]=endings[sceneId];const dead=['floodDeath','riverDeath','raidDeath','hungerDeath'].includes(sceneId);const story=dead?null:endingStory();
const hero=document.createElement('div');hero.className='finalhero';hero.innerHTML='<div class="scene">THE YEAR IS OVER · YOUR FATE IS REVEALED</div><div class="ending"></div><h2 class="title"></h2><p class="finalsubtitle"></p>';
hero.querySelector('.ending').textContent=emoji;hero.querySelector('h2').textContent=title;hero.querySelector('.finalsubtitle').textContent=description;screen.append(hero);
const ep=document.createElement('div');ep.className='epilogue';const h3=document.createElement('h3');h3.textContent='One year later…';if(dead){h3.textContent='Your adventure ends here';ep.append(h3,para('Not every life in the ancient world had a happy ending. You can try another path and discover how different choices change the story.'));}else{ep.append(h3,para(story.place),para(story.detail));}screen.append(ep);
if(!dead){const fate=document.createElement('div');fate.className='fate';const ftitle=document.createElement('div');ftitle.className='scene';ftitle.textContent='YOUR SURVIVAL FATE';const fh=document.createElement('h3');fh.textContent=story.badge+' '+story.fate;fate.append(ftitle,fh,para(story.callback));screen.append(fate);}
const replay=document.createElement('div');replay.className='replay';replay.append(button('Try a Different Life ↻',()=>{seed++;init()}));screen.append(replay);
const journal=document.createElement('details');journal.className='history';const jsum=document.createElement('summary');jsum.textContent='Read your adventure journal ('+history.length+' decisions)';journal.append(jsum);history.forEach(h=>{let d=document.createElement('div');d.className='journal';let strong=document.createElement('strong');strong.textContent=h.title;d.append(strong,para('You chose: '+h.choice,'muted'),para(h.result,'muted'));journal.append(d)});screen.append(journal);
const info=document.createElement('details');info.className='history';info.innerHTML='<summary>Behind the history</summary><p>Southern Mesopotamian farming relied on irrigation and coordinated labor. City-states such as Ur supported craft specialists, merchants, administrators, and temples. Trade brought resources such as metals from other regions. Floods, water disputes, shortages, and warfare could affect ordinary households. The characters and specific events in this adventure are fictional; the dilemmas are based on plausible features of Sumerian life.</p>';screen.append(info);return}
const node=getNodes()[sceneId];if(!node){sceneId='farmEnding';render();return}let lab=document.createElement('div');lab.className='scene';lab.textContent=sceneId==='intro'?'Your story begins':`A new chapter · ${visits+1}`;screen.append(lab);let art=document.createElement('div');art.className='art';art.textContent=node.emoji;screen.append(art);let h=document.createElement('h2');h.className='title';h.textContent=node.title;screen.append(h,para(node.story));const eligible=node.choices.filter(c=>!c.condition||c.condition(s));eligible.forEach((c,i)=>{const b=button(String.fromCharCode(65+i)+'.  '+c.text,()=>{const from=sceneId;add(c.changes);history.push({title:node.title,choice:c.text,result:c.result});visits++;sceneId=c.next;if(endings[sceneId]&&!['floodDeath','riverDeath','raidDeath','hungerDeath'].includes(sceneId)&&s.food<=0&&s.health<=2){sceneId='hungerDeath'}if(visits>11&&!endings[sceneId])sceneId=s.place==='city'?'cityEnding':'farmEnding';render();window.scrollTo?.({top:0,behavior:'smooth'})},'choice');screen.append(b)});}
init();})();
</script></body></html>
